# Konfigurasi Nginx untuk server sendiri / infrastruktur instansi: frontend statis, API Laravel lewat
# PHP-FPM, dan gambar unggahan, semuanya satu origin. Langkah pemasangan: deploy/README.md.
# BELUM DIUJI di server nyata: jalankan `nginx -t` dan uji dengan https://securityheaders.com
# sebelum dipakai. Sesuaikan server_name, jalur sertifikat, jalur aplikasi, dan soket PHP-FPM.
#
# Susunan folder yang diasumsikan:
#   /var/www/pemdi/backend         Laravel (public/index.php satu-satunya skrip PHP yang dijalankan)
#   /var/www/pemdi/frontend/dist   hasil `npm run build`
#
# Sumber kebenaran header adalah frontend/public/_headers (dipakai juga uji e2e). Bila diubah di
# sana, ubah juga di sini: uji frontend/src/test/security-headers.test.ts memastikan keduanya sama.
# Semua API disajikan se-origin di bawah /api (Laravel), jadi connect-src 'self' sudah cukup.

server {
    listen 80;
    server_name pemdi.example.go.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pemdi.example.go.id;

    # ssl_certificate     /etc/ssl/pemdi/fullchain.pem;
    # ssl_certificate_key /etc/ssl/pemdi/privkey.pem;

    root /var/www/pemdi/frontend/dist;
    index index.html;
    server_tokens off;

    # Sedikit di atas batas unggah gambar aplikasi (5 MB): body yang lebih besar ditolak di sini,
    # sebelum sampai ke PHP. Samakan dengan upload_max_filesize/post_max_size di php.ini.
    client_max_body_size 8m;

    # Header keamanan, juga berlaku untuk respons Laravel dan /storage. add_header di level server
    # diwarisi location HANYA bila location itu tidak memakai add_header sendiri; karena itu cache
    # di bawah memakai `expires`, bukan add_header.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-vSV98NxOHJ8Tek3LzPC83WtmtKSHOO0TTmuchfXQNxc='; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; media-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # Berkas hasil build ber-hash: aman di-cache lama.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Gambar konten tidak ber-hash.
    location /images/ {
        expires 1d;
        try_files $uri =404;
    }

    # index.html selalu divalidasi ulang agar rilis baru langsung terlihat.
    location = /index.html {
        expires -1;
    }

    # Berkas konfigurasi hosting lain tidak perlu terbuka.
    location = /_headers {
        return 404;
    }

    # Berkas tersembunyi (.env, .git, dll.) tidak pernah dilayani.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Backend Laravel: API, sitemap, dan halaman artikel untuk pratinjau tautan (WhatsApp, dll.),
    # yaitu index.html yang meta-nya diganti milik artikel (backend/app/Support/FrontendPage.php).
    # Hanya slug berformat sah yang diteruskan; URL lain (mis. encoding rusak) dilayani SPA fallback.
    # `try_files /tidak-ada @laravel` meneruskan permintaan ke @laravel tanpa mencari berkas.
    location ^~ /api/ {
        try_files /tidak-ada @laravel;
    }

    location = /sitemap.xml {
        try_files /tidak-ada @laravel;
    }

    location ~ ^/portfolio/[a-z0-9-]+/?$ {
        try_files /tidak-ada @laravel;
    }

    # Gambar unggahan Admin/Penulis: berkas statis, TANPA eksekusi PHP. Nama berkas berupa UUID dan
    # tidak pernah berubah isinya, jadi aman di-cache lama.
    location ^~ /storage/ {
        alias /var/www/pemdi/backend/storage/app/public/;
        expires 1y;
    }

    # Satu-satunya skrip PHP yang dijalankan adalah public/index.php (SCRIPT_FILENAME dikunci), jadi
    # berkas .php yang terunggah atau tersisa tidak bisa dieksekusi lewat URL.
    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/pemdi/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    # SPA fallback: path tak dikenal dilayani index.html (halaman 404 ditangani aplikasi).
    location / {
        try_files $uri /index.html;
    }
}
