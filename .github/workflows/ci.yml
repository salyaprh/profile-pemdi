name: CI

on:
  pull_request:
  push:
    branches: [main]

# Hak minimum: workflow ini hanya membaca kode.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend (frontend/): gaya, lint, tipe, uji unit/komponen, build, dan guard privasi.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      # Action di-pin ke commit SHA (bukan tag yang bisa digeser). Dependabot memperbaruinya.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependency sesuai lockfile
        run: npm ci

      # Hanya dependency produksi: kerentanan di tooling dev tidak ikut ke situs.
      - name: Audit dependency produksi
        run: npm audit --omit=dev --audit-level=high

      - name: Format (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Uji unit dan komponen (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Pastikan bundle tidak memuat font dari pihak ketiga
        run: |
          if grep -rIlE "fonts\.(googleapis|gstatic)\.com" dist; then
            echo "::error::Bundle masih merujuk Google Fonts. Periksa vite-plugins/selfHostFonts.ts."
            exit 1
          fi

  # Backend Laravel (backend/) pada PHP minimum yang didukung (8.3) dan versi terbaru.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl, pdo_sqlite
          coverage: none

      - name: Install dependency sesuai lockfile
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit dependency
        run: composer audit

      - name: Gaya kode (Pint)
        run: composer lint

      - name: Analisis statis (Larastan)
        run: composer analyse

      - name: Uji (PHPUnit)
        run: composer test

  # Uji end-to-end di browser nyata terhadap build produksi yang dilayani dengan header dari
  # frontend/public/_headers, dengan /api diteruskan ke backend Laravel sungguhan (SQLite e2e):
  # CSP, keamanan, SEO, routing, pencarian, formulir, login/panel admin, dan audit axe.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: gd, intl, pdo_sqlite
          coverage: none

      - name: Install dependency backend
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install dependency sesuai lockfile
        run: npm ci

      - name: Pasang Chromium untuk Playwright
        run: npx playwright install --with-deps chromium

      # Playwright menyalakan backend (e2e/start-backend.mjs) dan membangun serta melayani situs
      # (e2e/start.mjs) sendiri; lihat webServer di playwright.config.ts.
      - name: Uji e2e (Playwright)
        run: npm run test:e2e

      - name: Unggah laporan bila gagal
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laporan-playwright
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
