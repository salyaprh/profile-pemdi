name: CI

on:
  pull_request:
  push:
    branches: [main]

# Hak minimum: workflow ini hanya membaca kode.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Action di-pin ke commit SHA (bukan tag yang bisa digeser). Dependabot memperbaruinya.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependency sesuai lockfile
        run: npm ci

      # Hanya dependency produksi: kerentanan di tooling dev tidak ikut ke situs.
      - name: Audit dependency produksi
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check dan build
        run: npm run build

      - name: Pastikan bundle tidak memuat font dari pihak ketiga
        run: |
          if grep -rIlE "fonts\.(googleapis|gstatic)\.com" dist; then
            echo "::error::Bundle masih merujuk Google Fonts. Periksa vite-plugins/selfHostFonts.ts."
            exit 1
          fi
